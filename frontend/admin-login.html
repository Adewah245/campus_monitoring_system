<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - CampusTrack</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="login-page">


    <div class="login-wrapper">


        <!-- LEFT SIDE -->

        <div class="login-brand">


            <div class="login-brand-content">


                <div class="login-logo">
                    C
                </div>


                <h1>
                    CampusTrack
                </h1>


                <p>
                    Campus System Monitoring
                </p>


                <div class="login-line"></div>


                <p class="login-description">
                    Monitor campus systems, manage users,
                    and keep track of system activity
                    from one place.
                </p>


            </div>


        </div>



        <!-- RIGHT SIDE -->

        <div class="login-form-section">


            <div class="login-card">


                <div class="login-heading">


                    <h2>
                        Admin Login
                    </h2>


                    <p>
                        Sign in to access User Management
                    </p>


                </div>



                <form id="adminLoginForm">


                    <!-- EMAIL -->

                    <div class="login-input-group">


                        <label for="adminEmail">
                            Email Address
                        </label>


                        <input
                            type="email"
                            id="adminEmail"
                            placeholder="admin@campustrack.com"
                            required
                        >


                    </div>



                    <!-- PASSWORD -->

                    <div class="login-input-group">


                        <label for="adminPassword">
                            Password
                        </label>


                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter your password"
                            required
                        >


                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login as Admin
                    </button>


                    <p id="loginMessage"></p>


                </form>



                <div class="login-footer">


                    <span>
                        🔒 Admin access only
                    </span>


                </div>


            </div>


        </div>


    </div>



    <script src="js/admin-login.js"></script>


</body>

</html>
